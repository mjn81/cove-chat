services:
  backend:
    image: mjn81/cove-server:latest
    ports:
      - "4000:4000"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
      - "9090:9090/udp"
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml
    restart: unless-stopped

  frontend:
    image: mjn81/cove-webclient:latest
    ports:
      - "3000:80"
    environment:
      # Update this to your public domain or server IP in production
      - VITE_API_URL=http://localhost:4000
    depends_on:
      - backend
    restart: unless-stopped
