services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cove-server:latest
    ports:
      - "4000:4000"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
      - "9090:9090/udp"
    volumes:
      - ./backend/data:/app/data
      - ./backend/config.toml:/app/config.toml
    restart: unless-stopped

  frontend:
    build:
      context: ./client-web
      dockerfile: Dockerfile
    image: cove-webclient:latest
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:4000
    depends_on:
      - backend
    restart: unless-stopped
