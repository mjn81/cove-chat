# ─────────────────────────────────────────────────────────────────────────────
# Cove roadmap. THIS is the file to edit; the landing page and /roadmap read it.
#
#   Ship something   -> cut its block and paste it under the `shipped` phase
#   Start something  -> move it under `now`
#   Add an idea      -> copy any block, give it a unique `id`, a `title` and a short `note`
#   Dates            -> every item gets `date: "YYYY-MM-DD"`: the ship date, or the target date while planned
#
# Status comes from the phase (shipped = done, now = in progress, others = planned).
# Override one item with `status: done | progress | planned` if needed.
# `area` is one of: calls privacy admin clients chat i18n platform security files ops
#
# Translations are optional: roadmap.fa.yaml / roadmap.ar.yaml map an `id` to a translated
# title/note. Missing ids fall back to the English text here.
# ─────────────────────────────────────────────────────────────────────────────
phases:
  - id: shipped
    title: Shipped
    subtitle: Available today
    status: done
    items:
      - id: encrypted-chat
        area: chat
        title: "Encrypted messaging"
        note: "AES-256-GCM in the client, keys wrapped by your master key."
      - id: realtime
        area: chat
        title: "Real-time delivery and presence"
        note: "WebSocket hub with typing and online status."
      - id: channels-dms
        area: chat
        title: "Channels, DMs and friends"
        note: "Member, admin and owner roles per channel."
      - id: voice-notes
        area: chat
        title: "Voice notes and emoji picker"
        note: "Record and send audio, react and pick emoji."
      - id: files
        area: files
        title: "Files, images and video messages"
        note: "Uploads with size limits and ffmpeg transcoding."
      - id: webrtc-calls
        area: calls
        title: "Group calls and screen sharing"
        note: "In-process WebRTC SFU with DTLS-SRTP and embedded TURN."
      - id: raw-udp
        area: calls
        title: "Air-gapped UDP voice"
        note: "The first, audio-only mode for isolated LANs. It was replaced by the encrypted UDP media router listed under In progress."
      - id: whisper
        area: privacy
        title: "Whisper chats"
        note: "Zero-persistence end-to-end encrypted rooms."
      - id: admin-panel
        area: admin
        title: "Server admin panel"
        note: "Roles, registration modes, config editor, audit log."
      - id: invites
        area: admin
        title: "Invite-only registration"
        note: "Invitation codes from the panel or config.toml."
      - id: backup
        area: admin
        title: "Encrypted backup and restore"
        note: "Owner-only download and a restore command."
      - id: android
        area: clients
        title: "Native Android app"
        note: "Compose client with calls, Whisper and swipe actions."
      - id: desktop
        area: clients
        title: "Desktop app"
        note: "Wails app for Windows, macOS and Linux."
      - id: web-client
        area: clients
        title: "Web client with light and dark themes"
        note: "React app, installable via Docker."
      - id: languages
        area: i18n
        title: "English, Persian and Arabic"
        note: "Full right-to-left layout support."
      - id: docker
        area: ops
        title: "Docker images and Compose"
        note: "Server and web client images, one config file."
      - id: openapi
        area: platform
        title: "REST API with OpenAPI docs"
        note: "Every route documented with its access tier."
      - id: auth-hardening
        area: security
        title: "Hardened sessions"
        note: "httpOnly cookies, CSRF tokens, Argon2id, rate limits."
      - id: selection-mode
        area: chat
        title: "Multi-select message actions"
        note: "Select several messages and act on them at once, Telegram-style."
        date: "2026-11-01"
      - id: chat-backgrounds
        area: chat
        title: "More chat backgrounds"
        note: "A wider set of SVG pattern wallpapers."
        date: "2026-11-01"
      - id: audio-playback
        area: files
        title: "Inline audio player"
        note: "Uploaded audio plays in the chat, the same way images show."
        date: "2026-11-01"
      - id: notif-icon
        area: clients
        title: "Custom notification icon"
        note: "Cove's own glyph in system notifications."
        date: "2026-11-01"
      - id: invite-cards
        area: chat
        title: "Invite cards"
        note: "Share a channel as a card with a Join button, no raw links."
        date: "2026-11-01"
      - id: profile-photos
        area: clients
        title: "Profile photo gallery"
        note: "Up to five photos, a Telegram-style cropper and a full-screen viewer."
        date: "2026-11-01"
      - id: audio-playlist
        area: files
        title: "Audio playlist"
        note: "Switch between a chat's voice notes and audio files; the next one plays by itself."
        date: "2026-11-01"
      - id: forward-all
        area: chat
        title: "Forward any message"
        note: "Voice notes, files, video messages and invites, several at a time."
        date: "2026-11-01"
      - id: alerts
        area: clients
        title: "Whisper and call alerts"
        note: "Native notifications and their own sounds for Whisper requests and incoming calls."
        date: "2026-11-01"
      - id: android-trust
        area: clients
        title: "Trusted Android builds"
        note: "Signing fixes so installs verify cleanly."
        date: "2026-11-01"
      - id: api-contract
        area: platform
        title: "Versioned API and compatibility checks"
        note: "A written API standard, stable error codes, paged lists and capability checks so older clients degrade gracefully."
        date: "2026-11-04"
      - id: auto-update
        area: platform
        title: "Automatic updates"
        note: "Desktop and Android check for updates and ask first; server admins update from the admin panel, or upload a release for air-gapped servers."
        date: "2026-11-04"

      - id: themes
        area: platform
        title: "Themes and custom colors"
        note: "Eleven built-in themes, your own themes as .covetheme files you can share in chat, try before you keep, and chat backgrounds. Themes are data only, so they cannot run code."
        date: "2026-11-09"
      - id: emoji
        area: chat
        title: "Emoji styles and custom emoji"
        note: "Noto by default on every platform, plus Twemoji, Blobmoji, Fluent and FxEmojis built into the server (no internet needed); admins choose the styles and can upload custom emoji. A Telegram-style picker on web, desktop and Android."
        date: "2026-11-09"
      - id: stickers
        area: chat
        title: "Stickers and animated emoji"
        note: "Two default sticker packs, packs you make yourself (with admin limits) and big animated emoji when a message is a single emoji, on web, desktop and Android."
        date: "2026-11-09"
      - id: markdown
        area: chat
        title: "Markdown and link rendering"
        note: "Bold, italic, strikethrough, inline and fenced code with a copy button, quotes and safe links, on web, desktop and Android. Raw HTML is never rendered, and release notes use the same renderer."
        date: "2026-11-10"
      - id: copy-select
        area: chat
        title: "Text selection and copy"
        note: "Select and copy message text on web and desktop, copy code blocks and links with one tap or long-press. On Android a long-press copies the whole message."
        date: "2026-11-10"
      - id: net-indicator
        area: calls
        title: "Connection indicator"
        note: "A small status dot for the server connection, and a signal indicator inside calls."
        date: "2026-11-10"
      - id: persian
        area: i18n
        title: "Complete Persian and Arabic translations"
        note: "Every string in the web and Android clients is translated; the remaining hard-coded English in chat, members, settings and sign-in is gone."
        date: "2026-11-10"

  - id: now
    title: In progress
    subtitle: Being worked on right now
    status: progress
    items:
      - id: bots
        area: chat
        title: "Bot API"
        note: "Bot accounts with tokens, slash commands, buttons, a keyboard-replacing action menu, a gateway and signed webhooks. Server and web are built; Android is next."
        date: "2026-12-15"
      - id: ui-perf
        area: chat
        title: "UI performance"
        note: "Cold start from cache on web and Android and memoised message rows are in; smoother long message lists are still being worked on."
        date: "2026-12-15"
      - id: udp-media
        area: calls
        title: "UDP video and screen sharing"
        note: "The server router and the desktop and Android clients are built and unit tested. Still to do: a run on real devices. Browsers cannot open raw UDP, so the web client keeps its call buttons off in this mode."
        date: "2026-12-31"
      - id: secure-udp
        area: calls
        title: "Encrypted UDP for closed networks"
        note: "AES-256-GCM sessions with replay protection and key rotation are built and tested on the server, desktop and Android. Still to do: verification on real devices and networks."
        date: "2026-12-31"

  - id: next
    title: Next
    subtitle: Polish, privacy and media
    status: planned
    items:
      - id: bots-android
        area: clients
        title: "Bots on Android"
        note: "Bot messages with buttons, slash commands and the action menu in the native app."
        date: "2027-01-31"
      - id: security-tab
        area: privacy
        title: "Security settings tab"
        note: "Control who can DM you or add you to groups."
      - id: link-previews
        area: privacy
        title: "Secure link previews"
        note: "Caching proxy so sites never see user IPs."
      - id: voice-dsp
        area: calls
        title: "Noise suppression and AGC controls"
        note: "Voice processing settings in the apps."
      - id: opus-vad
        area: calls
        title: "Opus and voice activity detection"
        note: "Lower bandwidth for voice and air-gapped UDP calls."
      - id: video-player
        area: chat
        title: "Native video player"
        note: "Secure in-app playback."

  - id: later
    title: Later
    subtitle: Platforms and ecosystem
    status: planned
    items:
      - id: pwa
        area: clients
        title: "Progressive Web App"
        note: "Install the web client like an app."
      - id: ios
        area: clients
        title: "iOS client"
        note: "Native app sharing the same encryption core."
      - id: plugins
        area: platform
        title: "Plugin architecture"
        note: "Community extensions, starting with stickers."
      - id: s3
        area: platform
        title: "S3-compatible storage"
        note: "AWS, MinIO or DigitalOcean for large files."
      - id: bot-api
        area: platform
        title: "Bot API"
        note: "Build bots and integrations against a stable interface."
      - id: rich-markdown
        area: chat
        title: "Advanced markdown"
        note: "Spoilers, underline and a formatting toolbar on top of today's bold, italic, code and quotes."
      - id: in-app-calls
        area: calls
        title: "In-app and server-wide calls"
        note: "Start calls inside Cove instead of sharing group links."
      - id: email-notif
        area: ops
        title: "Email notifications"
        note: "Optional email alerts configured by the server admin."

  - id: future
    title: Future
    subtitle: Relays, federation and redesign
    status: planned
    items:
      - id: federation
        area: platform
        title: "Server-to-server federation"
        note: "Independent Cove servers that trust each other and route messages."
      - id: relay-mode
        area: platform
        title: "Relay server mode"
        note: "Lightweight relay servers that bridge networks."
      - id: ui-redesign
        area: chat
        title: "UI redesign"
        note: "A refreshed interface across all clients."
