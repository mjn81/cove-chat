# ─────────────────────────────────────────────────────────────────────────────
# Cove roadmap. THIS is the file to edit; the landing page and /roadmap read it.
#
#   Ship something   -> cut its block and paste it under the `shipped` phase
#   Start something  -> move it under `now`
#   Add an idea      -> copy any block, give it a unique `id`, a `title` and a short `note`
#
# Status comes from the phase (shipped = done, now = in progress, others = planned).
# Override one item with `status: done | progress | planned` if needed.
# `area` is one of: calls privacy admin clients chat i18n platform security files ops
#
# Translations are optional: roadmap.fa.yaml / roadmap.ar.yaml map an `id` to a translated
# title/note. Missing ids fall back to the English text here.
# ─────────────────────────────────────────────────────────────────────────────
phases:
  - id: shipped
    title: Shipped
    subtitle: Available today
    status: done
    items:
      - id: encrypted-chat
        area: chat
        title: "Encrypted messaging"
        note: "AES-256-GCM in the client, keys wrapped by your master key."
      - id: realtime
        area: chat
        title: "Real-time delivery and presence"
        note: "WebSocket hub with typing and online status."
      - id: channels-dms
        area: chat
        title: "Channels, DMs and friends"
        note: "Member, admin and owner roles per channel."
      - id: voice-notes
        area: chat
        title: "Voice notes and emoji picker"
        note: "Record and send audio, react and pick emoji."
      - id: files
        area: files
        title: "Files, images and video messages"
        note: "Uploads with size limits and ffmpeg transcoding."
      - id: webrtc-calls
        area: calls
        title: "Group calls and screen sharing"
        note: "In-process WebRTC SFU with DTLS-SRTP and embedded TURN."
      - id: raw-udp
        area: calls
        title: "Air-gapped UDP voice"
        note: "Audio-only mode for isolated LANs."
      - id: whisper
        area: privacy
        title: "Whisper chats"
        note: "Zero-persistence end-to-end encrypted rooms."
      - id: admin-panel
        area: admin
        title: "Server admin panel"
        note: "Roles, registration modes, config editor, audit log."
      - id: invites
        area: admin
        title: "Invite-only registration"
        note: "Invitation codes from the panel or config.toml."
      - id: backup
        area: admin
        title: "Encrypted backup and restore"
        note: "Owner-only download and a restore command."
      - id: android
        area: clients
        title: "Native Android app"
        note: "Compose client with calls, Whisper and swipe actions."
      - id: desktop
        area: clients
        title: "Desktop app"
        note: "Wails app for Windows, macOS and Linux."
      - id: web-client
        area: clients
        title: "Web client with light and dark themes"
        note: "React app, installable via Docker."
      - id: languages
        area: i18n
        title: "English, Persian and Arabic"
        note: "Full right-to-left layout support."
      - id: docker
        area: ops
        title: "Docker images and Compose"
        note: "Server and web client images, one config file."
      - id: openapi
        area: platform
        title: "REST API with OpenAPI docs"
        note: "Every route documented with its access tier."
      - id: auth-hardening
        area: security
        title: "Hardened sessions"
        note: "httpOnly cookies, CSRF tokens, Argon2id, rate limits."
      - id: selection-mode
        area: chat
        title: "Multi-select message actions"
        note: "Select several messages and act on them at once, Telegram-style."
      - id: chat-backgrounds
        area: chat
        title: "More chat backgrounds"
        note: "A wider set of SVG pattern wallpapers."
      - id: audio-playback
        area: files
        title: "Inline audio player"
        note: "Uploaded audio plays in the chat, the same way images show."
      - id: notif-icon
        area: clients
        title: "Custom notification icon"
        note: "Cove's own glyph in system notifications."
      - id: invite-cards
        area: chat
        title: "Invite cards"
        note: "Share a channel as a card with a Join button, no raw links."
      - id: profile-photos
        area: clients
        title: "Profile photo gallery"
        note: "Up to five photos, a Telegram-style cropper and a full-screen viewer."
      - id: audio-playlist
        area: files
        title: "Audio playlist"
        note: "Switch between a chat's voice notes and audio files; the next one plays by itself."
      - id: forward-all
        area: chat
        title: "Forward any message"
        note: "Voice notes, files, video messages and invites, several at a time."
      - id: alerts
        area: clients
        title: "Whisper and call alerts"
        note: "Native notifications and their own sounds for Whisper requests and incoming calls."
      - id: android-trust
        area: clients
        title: "Trusted Android builds"
        note: "Signing fixes so installs verify cleanly."

  - id: now
    title: In progress
    subtitle: Being worked on right now
    status: progress
    items:
      - id: markdown
        area: chat
        title: "Markdown and link rendering"
        note: "Custom renderer with link highlighting."
      - id: persian
        area: i18n
        title: "Complete Persian translations"
        note: "100% coverage across the web client."
      - id: ui-perf
        area: chat
        title: "UI performance"
        note: "Fewer re-renders and smoother message lists."
      - id: copy-select
        area: chat
        title: "Text selection and copy"
        note: "Select and copy message text everywhere."
      - id: net-indicator
        area: calls
        title: "Connection quality indicator"
        note: "Signal bars for WebSocket and calls."
        status: planned

  - id: next
    title: Next
    subtitle: Polish, privacy and media
    status: planned
    items:
      - id: security-tab
        area: privacy
        title: "Security settings tab"
        note: "Control who can DM you or add you to groups."
      - id: link-previews
        area: privacy
        title: "Secure link previews"
        note: "Caching proxy so sites never see user IPs."
      - id: voice-dsp
        area: calls
        title: "Noise suppression and AGC controls"
        note: "Voice processing settings in the apps."
      - id: opus-vad
        area: calls
        title: "Opus and voice activity detection"
        note: "Lower bandwidth for raw UDP voice."
      - id: video-player
        area: chat
        title: "Native video player"
        note: "Secure in-app playback."

  - id: later
    title: Later
    subtitle: Platforms and ecosystem
    status: planned
    items:
      - id: pwa
        area: clients
        title: "Progressive Web App"
        note: "Install the web client like an app."
      - id: ios
        area: clients
        title: "iOS client"
        note: "Native app sharing the same encryption core."
      - id: plugins
        area: platform
        title: "Plugin architecture"
        note: "Community extensions, starting with stickers."
      - id: s3
        area: platform
        title: "S3-compatible storage"
        note: "AWS, MinIO or DigitalOcean for large files."
      - id: api-contract
        area: platform
        title: "Versioned API and compatibility checks"
        note: "A standard API format and a clean way to handle client and server version mismatches."
      - id: auto-update
        area: platform
        title: "Automatic updates"
        note: "Desktop apps update themselves; server admins update with one button."
      - id: themes
        area: platform
        title: "Themes and custom colors"
        note: "Multiple palettes, custom themes, and a page to upload and download them."
      - id: bot-api
        area: platform
        title: "Bot API"
        note: "Build bots and integrations against a stable interface."
      - id: emoji
        area: chat
        title: "Native and custom emoji"
        note: "Native emoji, admin-curated sets and uploaded custom emoji."
      - id: rich-markdown
        area: chat
        title: "Advanced markdown"
        note: "Telegram-style formatting."
      - id: udp-media
        area: calls
        title: "UDP video and screen sharing"
        note: "A UDP router for video and screen share."
      - id: secure-udp
        area: calls
        title: "Encrypted UDP for closed networks"
        note: "Encryption for the air-gapped voice and media path."
      - id: in-app-calls
        area: calls
        title: "In-app and server-wide calls"
        note: "Start calls inside Cove instead of sharing group links."
      - id: email-notif
        area: ops
        title: "Email notifications"
        note: "Optional email alerts configured by the server admin."

  - id: future
    title: Future
    subtitle: Relays, federation and redesign
    status: planned
    items:
      - id: federation
        area: platform
        title: "Server-to-server federation"
        note: "Independent Cove servers that trust each other and route messages."
      - id: relay-mode
        area: platform
        title: "Relay server mode"
        note: "Lightweight relay servers that bridge networks."
      - id: ui-redesign
        area: chat
        title: "UI redesign"
        note: "A refreshed interface across all clients."
