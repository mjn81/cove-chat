  stickers: { title: "Стикеры и анимированные эмодзи", note: "Два набора стикеров по умолчанию, собственные наборы (с ограничениями администратора) и крупные анимированные эмодзи, когда сообщение состоит из одного эмодзи, — в вебе, на компьютере и Android." }
  markdown: { title: "Отображение Markdown и ссылок", note: "Жирный, курсив, зачеркнутый, строчный и блочный код с кнопкой копирования, цитаты и безопасные ссылки в вебе, на компьютере и Android. Сырой HTML никогда не отображается, а описания релизов используют тот же обработчик." }
  copy-select: { title: "Выделение и копирование текста", note: "Выделяйте и копируйте текст сообщений в вебе и на компьютере, копируйте блоки кода и ссылки одним касанием или долгим нажатием. На Android долгое нажатие копирует все сообщение." }
  net-indicator: { title: "Индикатор соединения", note: "Небольшая точка состояния связи с сервером и индикатор сигнала во время звонков." }
