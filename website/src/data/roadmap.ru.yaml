  udp-media: { title: "Видео и демонстрация экрана по UDP", note: "Серверный маршрутизатор и клиенты для компьютера и Android собраны и покрыты модульными тестами. Осталось проверить на реальных устройствах. Браузеры не умеют работать с сырым UDP, поэтому в этом режиме кнопки звонков в вебе отключены." }
  secure-udp: { title: "Зашифрованный UDP для закрытых сетей", note: "Сеансы AES-256-GCM с защитой от повторов и сменой ключей реализованы и протестированы на сервере, компьютере и Android. Осталось проверить на реальных устройствах и сетях." }
  security-tab: { title: "Настройки приватности", note: "Выбирайте, кто может писать вам, добавлять вас в каналы и отправлять заявки в друзья: в вебе, на компьютере и Android." }
  link-previews: { title: "Безопасный предпросмотр ссылок", note: "Кеширующий прокси, чтобы сайты не видели IP-адреса пользователей." }
