      name:
        type: string
      order:
        type: integer
    type: object
  internal_api.UpdateStartRequest:
    properties:
      password:
        description: Password is the owner's current password (step-up for replacing
          the server binary).
        type: string
      source:
        description: 'Source is "release" (default: download the latest) or "upload"
          (install the staged manual upload).'
        enum:
        - release
        - upload
        example: upload
        type: string
    type: object
  internal_api.UpdateStartResponse:
    properties:
      state:
        example: downloading
        type: string
      status:
        example: success
        type: string
      version:
        description: the release being installed
        example: 0.10.0
        type: string
    type: object
  internal_api.UpdateUploadInfo:
    properties:
      kind:
        enum:
        - zip
        - binary
        example: zip
        type: string
      sha256:
        example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        type: string
      size_bytes:
        example: 31457280
        type: integer
      verified:
        description: Verified is true when a checksum was supplied and matched; false
          means the owner chose to trust the file.
        type: boolean
      version:
        example: 0.10.0
        type: string
    type: object
  internal_api.UpdateUploadResponse:
    properties:
      status:
        example: success
        type: string
      upload:
        $ref: '#/definitions/internal_api.UpdateUploadInfo'
    type: object
  internal_api.UpdateUserRequest:
    properties:
      allow_channel_adds:
        type: string
      avatar_id:
        type: string
      avatar_ids:
        items:
          type: string
        type: array
      banner_color:
        type: string
      custom_msg:
        type: string
      dm_permission:
        type: string
      friend_request_permission:
        type: string
      old_password:
        type: string
      password:
        type: string
      status_preference:
        type: string
      username:
        type: string
    type: object
  internal_api.UploadFileResponse:
    properties:
      channel_id:
        type: string
      duration_sec:
        type: number
      id:
        type: string
      mime:
        example: application/octet-stream
        type: string
      owner_id:
        type: string
      processing_status:
        enum:
        - ready
        - processing
        - failed
        type: string
      size:
        type: integer
      thumb_ciphertext:
        items:
          type: integer
        type: array
      thumb_nonce:
        items:
          type: integer
        type: array
      uploaded_at:
        type: string
    type: object
  internal_api.UserPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.UserResponse'
        type: array
      next_cursor:
        type: string
    type: object
  internal_api.UserResponse:
    properties:
      allow_channel_adds:
        type: string
      avatar_id:
        type: string
      avatar_ids:
        items:
          type: string
        type: array
      banner_color:
        type: string
      custom_msg:
        type: string
      dm_permission:
        type: string
      domain:
        example: localhost
        type: string
      friend_request_permission:
        type: string
      id:
        example: user-1
        type: string
      is_bot:
        description: IsBot marks bot accounts; clients show a BOT badge next to the
          name.
        type: boolean
      server_role:
        description: ServerRole is only filled in for the caller's own account (/api/me),
          never for other users.
        type: string
      status:
        example: online
        type: string
      status_preference:
        example: auto
        type: string
      username:
        example: alice
        type: string
    type: object
  internal_api.VersionResponse:
    properties:
      api_version:
        description: APIVersion is the integer client/server contract version, bumped
          only on breaking changes.
        example: 2
        type: integer
      capabilities:
        description: Capabilities names the optional features this server supports;
          clients gate UI on these, not on versions.
        example:
        - invite_messages
        - whisper
        - webrtc_sfu
        items:
          type: string
        type: array
      min_client_version:
        description: MinClientVersion is the oldest client semver the admin supports;
          empty when none is set.
        example: 0.9.0
        type: string
      udp_port:
        example: 9090
        type: integer
      version:
        example: V1.0.0
        type: string
    type: object
host: localhost:4000
info:
  contact:
    name: Cove Support
    url: https://github.com/cove/backend/cove-chat
  description: Self-hosted, end-to-end encrypted communication platform.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://cove-chat.local/terms
  title: Cove API
  version: 0.1.0
paths:
  /api/admin/admins:
    get:
      description: '**Access:** Server Admin.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.AdminListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List admins
      tags:
      - admin
  /api/admin/admins/{username}:
    delete:
      consumes:
      - application/json
      description: '**Access:** Server Owner, with their password.'
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      - description: Owner password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.PasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove an account's admin access
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: '**Access:** Server Owner, with their password.'
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      - description: Owner password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.PasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Give an account admin access
      tags:
      - admin
  /api/admin/audit:
    get:
      description: |-
        Paged (`{items, next_cursor}`), newest first. Every entry is reachable by following the cursor.
        **Access:** Server Admin.
      parameters:
      - description: Page size (1-100, default 50)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from the previous page's next_cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.AuditListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Admin audit trail
      tags:
      - admin
  /api/admin/backup:
    post:
      consumes:
      - application/json
      description: |-
        Returns a passphrase-encrypted snapshot of the database (messages stay ciphertext). Restore it with the server CLI.
        **Access:** Server Owner, with their password.
      parameters:
      - description: Password and archive passphrase (min 12 chars)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.BackupRequest'
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download an encrypted backup
      tags:
      - admin
  /api/admin/config:
    get:
      description: |-
        Lists the settings the panel may change with their saved values. Secrets and file paths are never included.
        **Access:** Server Admin.
      produces:
      - application/json
      responses:
        "200":
