basePath: /
definitions:
  cove_backend_internal_bots.Author:
    properties:
      id:
        type: string
      is_bot:
        type: boolean
      username:
        type: string
    type: object
  cove_backend_internal_bots.MessageDTO:
    properties:
      author:
        $ref: '#/definitions/cove_backend_internal_bots.Author'
      buttons:
        items:
          items:
            $ref: '#/definitions/cove_backend_internal_models.Button'
          type: array
        type: array
      channel_id:
        type: string
      content:
        type: string
      edited_at:
        type: string
      id:
        type: string
      mentioned:
        description: Mentioned is true when the message mentions the receiving bot
          by @username or replies to one of its messages.
        type: boolean
      reply_to_id:
        type: string
      sent_at:
        type: string
      type:
        type: string
    type: object
  cove_backend_internal_models.AuditEntry:
    properties:
      action:
        description: e.g. "invite.create"
        type: string
      actor_id:
        type: string
      actor_name:
        type: string
      at:
        type: string
      id:
        type: string
      target:
        description: e.g. a username or invite code (never a secret)
        type: string
    type: object
  cove_backend_internal_models.BotCommand:
    properties:
      bot_id:
        type: string
      channel_id:
        description: empty = global
        type: string
      description:
        type: string
      name:
        type: string
      options:
        items:
          $ref: '#/definitions/cove_backend_internal_models.CommandOption'
        type: array
      updated_at:
        type: string
    type: object
  cove_backend_internal_models.Button:
    properties:
      custom_id:
        type: string
      disabled:
        type: boolean
      label:
        type: string
      style:
        type: string
      url:
        type: string
    type: object
  cove_backend_internal_models.CommandChoice:
    properties:
      name:
        type: string
      value:
        type: string
    type: object
  cove_backend_internal_models.CommandOption:
    properties:
      choices:
        items:
          $ref: '#/definitions/cove_backend_internal_models.CommandChoice'
        type: array
      description:
        type: string
      name:
        type: string
      required:
        type: boolean
      type:
        type: string
    type: object
  cove_backend_internal_models.Message:
    properties:
      channel_id:
        type: string
      ciphertext:
        description: AES-256-GCM encrypted payload
        items:
          type: integer
        type: array
      compression:
        description: '"none", "zstd", etc.'
        type: string
      edited_at:
        type: string
      id:
        type: string
      nonce:
        description: GCM nonce (also prepended in ciphertext)
        items:
          type: integer
        type: array
      reply_to_id:
        type: string
      sender_id:
        type: string
      sent_at:
        type: string
      sig:
        description: 'Reserved: future sender signature'
        items:
          type: integer
        type: array
      type:
        allOf:
        - $ref: '#/definitions/cove_backend_internal_models.MessageType'
        description: '"text" | "file" | "voice" | "video" | "invite"'
    type: object
  cove_backend_internal_models.MessageType:
    enum:
    - bot
    - text
    - file
    - voice
    - video
    - invite
    - sticker
    type: string
    x-enum-varnames:
    - MessageTypeBot
    - MessageTypeText
    - MessageTypeFile
    - MessageTypeVoice
    - MessageTypeVideo
    - MessageTypeInvite
    - MessageTypeSticker
  internal_api.AddMembersRequest:
    properties:
      user_ids:
        example:
        - '["user-1"'
        - '"user-2"]'
        items:
          type: string
        type: array
    type: object
  internal_api.AddMembersResponse:
    properties:
      added:
        items:
          type: string
        type: array
      skipped:
        items:
          $ref: '#/definitions/internal_api.SkippedMember'
        type: array
    type: object
  internal_api.AdminAccountResponse:
    properties:
      id:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  internal_api.AdminConfigResponse:
    properties:
      settings:
        items:
          $ref: '#/definitions/internal_api.ConfigSettingResponse'
        type: array
    type: object
  internal_api.AdminListResponse:
    properties:
      admins:
        items:
          $ref: '#/definitions/internal_api.AdminAccountResponse'
        type: array
    type: object
  internal_api.AdminOverviewResponse:
    properties:
      active_invites:
        example: 3
        type: integer
      channels:
        example: 12
        type: integer
      data_size_bytes:
        example: 10485760
        type: integer
      domain:
        example: chat.example.com
        type: string
      registration_mode:
        example: invite_only
        type: string
      uptime_seconds:
        example: 86400
        type: integer
      users:
        example: 42
        type: integer
      version:
        example: 0.9.0
        type: string
    type: object
  internal_api.AdminPackListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.PackResponse'
        type: array
    type: object
  internal_api.AnimatedEmojiEntry:
    properties:
      id:
        example: grinning-face
        type: string
      sequence:
        description: Sequence is lower-case hex code points joined by "-" with every
          FE0F removed.
        example: 1f600
        type: string
      url:
        example: /api/emoji/animated/9a8b7c6d5e4f/grinning-face.webp
        type: string
    type: object
  internal_api.AnimatedEmojiResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.AnimatedEmojiEntry'
        type: array
      version:
        example: 9a8b7c6d5e4f
        type: string
    type: object
  internal_api.AttributionEntry:
    properties:
      attribution:
        type: string
      id:
        example: noto
        type: string
      kind:
        enum:
        - emoji_style
        - sticker
        type: string
      license:
        example: Apache-2.0
        type: string
      name:
        type: string
      source:
        type: string
    type: object
  internal_api.AttributionResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.AttributionEntry'
        type: array
    type: object
  internal_api.AuditListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/cove_backend_internal_models.AuditEntry'
        type: array
      next_cursor:
        type: string
    type: object
  internal_api.BackupRequest:
    properties:
      passphrase:
        type: string
      password:
        type: string
    type: object
  internal_api.BotChannelPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.BotChannelResponse'
        type: array
      next_cursor:
        type: string
    type: object
  internal_api.BotChannelResponse:
    properties:
      id:
        type: string
      is_dm:
        type: boolean
      name:
        type: string
      scopes:
        items:
          type: string
        type: array
    type: object
  internal_api.BotCommandsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/cove_backend_internal_models.BotCommand'
        type: array
    type: object
  internal_api.BotDMRequest:
    properties:
      user_id:
        type: string
    type: object
  internal_api.BotDMResponse:
    properties:
      channel_id:
        type: string
    type: object
  internal_api.BotMemberPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.BotMemberResponse'
        type: array
      next_cursor:
        type: string
    type: object
  internal_api.BotMemberResponse:
    properties:
      id:
        type: string
      is_bot:
        type: boolean
      username:
        type: string
    type: object
  internal_api.BotMessagePageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/cove_backend_internal_bots.MessageDTO'
        type: array
      next_cursor:
        type: string
    type: object
  internal_api.BotMessageRequest:
    properties:
      buttons:
        items:
          items:
            $ref: '#/definitions/cove_backend_internal_models.Button'
          type: array
        type: array
      reply_to_id:
        type: string
      text:
        type: string
    type: object
  internal_api.BotMessageResponse:
    properties:
      channel_id:
        type: string
      id:
        type: string
      sent_at:
        type: string
    type: object
  internal_api.BotPageResponse:
    properties:
      can_create:
        description: CanCreate tells the UI whether the caller may create a bot now
          (policy, switch and their own cap).
        type: boolean
      enabled:
        type: boolean
      items:
        items:
          $ref: '#/definitions/internal_api.BotResponse'
        type: array
      max_per_user:
        type: integer
      next_cursor:
        type: string
    type: object
  internal_api.BotResponse:
    properties:
      avatar_id:
        type: string
      command_count:
        description: CommandCount is the number of global slash commands the bot registered
          (Explore shows it).
        type: integer
      created_at:
        type: string
      description:
        type: string
      disabled:
        type: boolean
      id:
        type: string
      install_count:
        type: integer
      online:
        description: Online is true while the bot has an open gateway connection.
        type: boolean
      owner_id:
        type: string
      public:
        type: boolean
      username:
        example: pingbot
        type: string
      webhook_url:
        description: WebhookURL is only filled in for the owner and admins.
        type: string
    type: object
  internal_api.BotTokenResponse:
    properties:
      token:
        type: string
    type: object
  internal_api.CaptchaChallengeResponse:
    properties:
      algorithm:
        example: SHA-256
        type: string
      challenge:
        description: Challenge is hex(SHA-256(salt + n)) for a secret number n the
          client has to find.
        example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        type: string
      maxnumber:
        description: MaxNumber is the upper bound of the search range [0, maxnumber].
        example: 100000
        type: integer
      salt:
        description: Salt is random and carries the expiry as ?expires=<unix>.
        example: 3f9a1c2b4d5e6f708192a3b4?expires=1893456000
        type: string
      signature:
        description: Signature is hex(HMAC-SHA256(server key, challenge)); the server
          checks it when the solution comes back.
        example: c0ffee...
        type: string
    type: object
  internal_api.ChannelBotResponse:
    properties:
      bot:
        $ref: '#/definitions/internal_api.BotResponse'
      installed_at:
        type: string
      installed_by:
        type: string
      scopes:
        items:
          type: string
        type: array
    type: object
  internal_api.ChannelBotsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.ChannelBotResponse'
        type: array
    type: object
  internal_api.ChannelPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.ChannelResponse'
        type: array
      next_cursor:
        type: string
    type: object
  internal_api.ChannelResponse:
    properties:
      avatar_id:
        type: string
      created_at:
        type: string
      creator_id:
        type: string
      description:
        type: string
      id:
        type: string
      invite_link:
        type: string
      is_private:
        type: boolean
      last_message_at:
        type: string
      last_message_ciphertext:
        items:
          type: integer
        type: array
      last_message_id:
        type: string
      last_message_nonce:
        items:
          type: integer
        type: array
      last_message_sender_id:
        type: string
      last_message_type:
        type: string
      member_avatars:
        additionalProperties:
          type: string
        type: object
      member_bots:
        additionalProperties:
          type: boolean
        description: MemberBots flags bot accounts among the members (clients show
          a BOT badge).
        type: object
      member_domains:
        additionalProperties:
          type: string
        type: object
      member_names:
        additionalProperties:
          type: string
        type: object
      member_roles:
        additionalProperties:
          type: integer
        type: object
      member_statuses:
        additionalProperties:
          type: string
        type: object
      member_system:
        additionalProperties:
          type: boolean
        description: MemberSystem flags built-in system accounts (the server's Cove
          account) among the members.
        type: object
      members:
        items:
          type: string
        type: array
      name:
        type: string
      unread_count:
        type: integer
      user_role:
        description: 0=Member, 10=Admin, 20=Owner
        type: integer
    type: object
  internal_api.CommandResponse:
    properties:
      bot_id:
        type: string
      bot_username:
        type: string
      description:
        type: string
      name:
        type: string
      options:
        items:
          $ref: '#/definitions/cove_backend_internal_models.CommandOption'
        type: array
    type: object
  internal_api.CommandsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.CommandResponse'
        type: array
    type: object
  internal_api.ConfigChanges:
    properties:
      bots.creation:
        enum:
        - admins
        - users
        - disabled
        type: string
      bots.enabled:
        type: boolean
      bots.max_per_user:
        type: integer
      bots.rate_limit_rps:
        type: integer
      bots.webhook_allow_private:
        type: boolean
      captcha.difficulty:
        enum:
        - low
        - medium
        - high
        type: string
      captcha.enabled:
        type: boolean
      emoji.default_style:
        enum:
        - native
        - noto
        - twemoji
        - blobmoji
        - fluent
        - fxemoji
        type: string
      emoji.enabled_styles:
        items:
          enum:
          - native
          - noto
          - twemoji
          - blobmoji
          - fluent
          - fxemoji
          type: string
        type: array
      packs.max_packs_per_user:
        type: integer
      packs.max_stickers_per_pack:
        type: integer
      packs.max_user_storage_mb:
        type: integer
      packs.user_uploads_enabled:
        type: boolean
      rate_limit.auth_rps:
        type: integer
      rate_limit.global_rps:
        type: integer
      registration.mode:
        enum:
        - open
        - invite_only
        - closed
        type: string
      security.token_expire_hours:
        type: integer
      server.dev:
        type: boolean
      server.domain:
        type: string
      server.frontend_origin:
        type: string
      server.http_port:
        type: integer
      server.max_file_size_mb:
        type: integer
      server.max_video_duration_sec:
        type: integer
      server.max_video_size_mb:
        type: integer
      server.trust_proxy_headers:
        type: boolean
      update.github_fallback:
        type: boolean
      update.manifest_url:
        type: string
      update.notify_admins:
        type: boolean
      voice.embedded_turn_enabled:
        type: boolean
      voice.max_participants_per_call:
        type: integer
      voice.mode:
        enum:
        - webrtc
        - raw_udp
        type: string
      voice.public_ip:
        type: string
    type: object
  internal_api.ConfigSettingResponse:
    properties:
      group:
        description: panel grouping
        type: string
      key:
        description: '"section.key", e.g. "registration.mode"'
        type: string
      max:
        type: integer
      min:
        type: integer
      name:
        description: TOML key
        type: string
      options:
        items:
          type: string
        type: array
      owner_only:
        description: |-
          OwnerOnly keys change network exposure or session security, so only the
          owner (with their password) may touch them.
        type: boolean
      restart_required:
        description: |-
          RestartRequired keys are saved to the file but only take effect after a
          restart. The others are applied live.
        type: boolean
      section:
        description: TOML table
        type: string
      type:
        description: '"enum" | "int" | "bool" | "string"'
        type: string
      value: {}
    type: object
  internal_api.CreateBotRequest:
    properties:
      description:
        type: string
      public:
        type: boolean
      username:
        example: pingbot
        type: string
      webhook_url:
        description: WebhookURL is optional; HTTPS only.
        type: string
    type: object
  internal_api.CreateBotResponse:
    properties:
      bot:
        $ref: '#/definitions/internal_api.BotResponse'
      token:
        type: string
      webhook_secret:
        description: WebhookSecret is set when a webhook URL was given; shown once.
        type: string
    type: object
  internal_api.CreateChannelRequest:
    properties:
      avatar_id:
        type: string
      description:
        example: A place for design discussions
        type: string
      is_private:
        example: false
        type: boolean
      members:
        example:
        - '["user-id-1"'
        - '"user-id-2"]'
        items:
          type: string
        type: array
      name:
        example: Design Team
        type: string
    type: object
  internal_api.CreateInviteRequest:
    properties:
      code:
        example: WELCOME-2026
        type: string
      expires_at:
        example: "2026-12-31T23:59:59Z"
        type: string
      max_uses:
        description: 0 = unlimited
        example: 10
        type: integer
      note:
        example: launch party
        type: string
    type: object
  internal_api.CreatePackRequest:
    properties:
      description:
        type: string
      name:
        example: My cats
        type: string
    type: object
  internal_api.CustomEmojiListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.CustomEmojiResponse'
        type: array
      version:
        description: Version changes whenever the set changes; use it (or the ETag)
          to refresh a cached list.
        example: v3
        type: string
    type: object
  internal_api.CustomEmojiResponse:
    properties:
      animated:
        type: boolean
      file_id:
        type: string
      height:
        type: integer
      name:
        example: party_parrot
        type: string
      url:
        example: /api/packs/custom-emoji/items/3f2a/file
        type: string
      width:
        type: integer
    type: object
  internal_api.DeleteAccountRequest:
    properties:
      password:
        example: s3cur3P@ss!
        type: string
    type: object
  internal_api.DeleteServerRequest:
    properties:
      confirm:
        example: chat.example.com
        type: string
      password:
        type: string
    type: object
  internal_api.EmojiStyleResponse:
    properties:
      attribution:
        type: string
      cell_size:
        example: 64
        type: integer
      count:
        description: Count is how many emoji the sheet covers; the client falls back
          to the device font for the rest.
        example: 3750
        type: integer
      default:
        type: boolean
      height:
        example: 3776
        type: integer
      id:
        example: noto
        type: string
      index_bytes:
        type: integer
      index_url:
        example: /api/emoji/styles/noto/3fa9c1d2e4b7/index.json
        type: string
      license:
        example: Apache-2.0
        type: string
      name:
        example: Noto Color Emoji
        type: string
      sheet_bytes:
        type: integer
      sheet_url:
        example: /api/emoji/styles/noto/3fa9c1d2e4b7/sheet.webp
        type: string
      source:
        type: string
      version:
        description: Version is a content hash of the sheet and index.
        example: 3fa9c1d2e4b7
        type: string
      width:
        example: 4096
        type: integer
    type: object
  internal_api.EmojiStylesResponse:
    properties:
      default_style:
        description: DefaultStyle is the style new devices start with. It is "native"
          (the device's own emoji font) or a style id.
        example: noto
        type: string
      enabled_styles:
        description: EnabledStyles lists every selectable style id, including "native"
          when allowed.
        items:
          type: string
        type: array
      styles:
        description: Styles holds the downloadable styles among EnabledStyles ("native"
          has no assets).
        items:
          $ref: '#/definitions/internal_api.EmojiStyleResponse'
        type: array
    type: object
  internal_api.ErrorResponse:
    properties:
      code:
        description: Code is a stable machine-readable code from the registry; clients
          branch on it, never on Error.
        example: unauthorized
        type: string
      details:
        additionalProperties:
          type: string
        description: Details carries optional code-specific data, e.g. min_client_version
          for client_outdated.
        type: object
      error:
        description: Error is a human-readable message (or an i18n key the client
          translates).
        example: invalid credentials
        type: string
    type: object
  internal_api.ExploreChannelPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.ExploreChannelResponse'
        type: array
      next_cursor:
        type: string
    type: object
  internal_api.ExploreChannelResponse:
    properties:
      avatar_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      member_count:
        type: integer
      name:
        type: string
    type: object
  internal_api.InstallBotRequest:
    properties:
      scopes:
        description: 'Scopes: messages.read, messages.send, members.read. Empty means
          messages.send only.'
        items:
          type: string
        type: array
    type: object
  internal_api.InteractionCallbackRequest:
    properties:
      buttons:
        items:
          items:
            $ref: '#/definitions/cove_backend_internal_models.Button'
          type: array
        type: array
      text:
        type: string
      type:
        description: |-
          Type is "message" (a new message), "update_message" (edit the message the button was on) or "ack"
          (acknowledge now, answer with one follow-up message later).
        enum:
        - message
        - update_message
        - ack
        type: string
    type: object
  internal_api.InteractionRequest:
    properties:
      bot_id:
        type: string
      command:
        description: Command and Options are set for type "command".
        type: string
      custom_id:
        type: string
      message_id:
        description: MessageID and CustomID are set for type "button"; CustomID alone
          for "keyboard".
        type: string
      options:
        additionalProperties: {}
        type: object
      type:
        description: Type is "command", "button" or "keyboard".
        enum:
        - command
        - button
        - keyboard
        type: string
    type: object
  internal_api.InteractionResponse:
    properties:
      delivered:
        type: boolean
      id:
        type: string
    type: object
  internal_api.InviteListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.InviteResponse'
        type: array
      next_cursor:
        type: string
    type: object
  internal_api.InvitePreviewResponse:
    properties:
      already_member:
        type: boolean
      avatar_id:
        type: string
      description:
        type: string
      id:
        type: string
      is_private:
        type: boolean
      member_count:
        type: integer
      name:
        type: string
    type: object
  internal_api.InviteResponse:
    properties:
      code:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      expires_at:
        type: string
      max_uses:
        type: integer
      note:
        type: string
      revoked:
        type: boolean
      source:
        type: string
      status:
        description: Status is "active", "expired", "exhausted" or "revoked".
        type: string
      uses:
        type: integer
