basePath: /
definitions:
  cove_backend_internal_models.AuditEntry:
    properties:
      action:
        description: e.g. "invite.create"
        type: string
      actor_id:
        type: string
      actor_name:
        type: string
      at:
        type: string
      id:
        type: string
      target:
        description: e.g. a username or invite code (never a secret)
        type: string
    type: object
  cove_backend_internal_models.Message:
    properties:
      channel_id:
        type: string
      ciphertext:
        description: AES-256-GCM encrypted payload
        items:
          type: integer
        type: array
      compression:
        description: '"none", "zstd", etc.'
        type: string
      edited_at:
        type: string
      id:
        type: string
      nonce:
        description: GCM nonce (also prepended in ciphertext)
        items:
          type: integer
        type: array
      reply_to_id:
        type: string
      sender_id:
        type: string
      sent_at:
        type: string
      sig:
        description: 'Reserved: future sender signature'
        items:
          type: integer
        type: array
      type:
        allOf:
        - $ref: '#/definitions/cove_backend_internal_models.MessageType'
        description: '"text" | "file" | "voice" | "video" | "invite"'
    type: object
  cove_backend_internal_models.MessageType:
    enum:
    - text
    - file
    - voice
    - video
    - invite
    type: string
    x-enum-varnames:
    - MessageTypeText
    - MessageTypeFile
    - MessageTypeVoice
    - MessageTypeVideo
    - MessageTypeInvite
  internal_api.AddMembersRequest:
    properties:
      user_ids:
        example:
        - '["user-1"'
        - '"user-2"]'
        items:
          type: string
        type: array
    type: object
  internal_api.AddMembersResponse:
    properties:
      added:
        items:
          type: string
        type: array
      skipped:
        items:
          $ref: '#/definitions/internal_api.SkippedMember'
        type: array
    type: object
  internal_api.AdminAccountResponse:
    properties:
      id:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  internal_api.AdminConfigResponse:
    properties:
      settings:
        items:
          $ref: '#/definitions/internal_api.ConfigSettingResponse'
        type: array
    type: object
  internal_api.AdminListResponse:
    properties:
      admins:
        items:
          $ref: '#/definitions/internal_api.AdminAccountResponse'
        type: array
    type: object
  internal_api.AdminOverviewResponse:
    properties:
      active_invites:
        example: 3
        type: integer
      channels:
        example: 12
        type: integer
      data_size_bytes:
        example: 10485760
        type: integer
      domain:
        example: chat.example.com
        type: string
      registration_mode:
        example: invite_only
        type: string
      uptime_seconds:
        example: 86400
        type: integer
      users:
        example: 42
        type: integer
      version:
        example: 0.9.0
        type: string
    type: object
  internal_api.AuditListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/cove_backend_internal_models.AuditEntry'
        type: array
      next_cursor:
        type: string
    type: object
  internal_api.BackupRequest:
    properties:
      passphrase:
        type: string
      password:
        type: string
    type: object
  internal_api.CaptchaChallengeResponse:
    properties:
      algorithm:
        example: SHA-256
        type: string
      challenge:
        description: Challenge is hex(SHA-256(salt + n)) for a secret number n the
          client has to find.
        example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        type: string
      maxnumber:
        description: MaxNumber is the upper bound of the search range [0, maxnumber].
        example: 100000
        type: integer
      salt:
        description: Salt is random and carries the expiry as ?expires=<unix>.
        example: 3f9a1c2b4d5e6f708192a3b4?expires=1893456000
        type: string
      signature:
        description: Signature is hex(HMAC-SHA256(server key, challenge)); the server
          checks it when the solution comes back.
        example: c0ffee...
        type: string
    type: object
  internal_api.ChannelPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.ChannelResponse'
        type: array
      next_cursor:
        type: string
    type: object
  internal_api.ChannelResponse:
    properties:
      avatar_id:
        type: string
      created_at:
        type: string
      creator_id:
        type: string
      description:
        type: string
      id:
        type: string
      invite_link:
        type: string
      is_private:
        type: boolean
      last_message_at:
        type: string
      last_message_ciphertext:
        items:
          type: integer
        type: array
      last_message_id:
        type: string
      last_message_nonce:
        items:
          type: integer
        type: array
      last_message_sender_id:
        type: string
      last_message_type:
        type: string
      member_avatars:
        additionalProperties:
          type: string
        type: object
      member_domains:
        additionalProperties:
          type: string
        type: object
      member_names:
        additionalProperties:
          type: string
        type: object
      member_roles:
        additionalProperties:
          type: integer
        type: object
      member_statuses:
        additionalProperties:
          type: string
        type: object
      member_system:
        additionalProperties:
          type: boolean
        description: MemberSystem flags built-in system accounts (the server's Cove
          account) among the members.
        type: object
      members:
        items:
          type: string
        type: array
      name:
        type: string
      unread_count:
        type: integer
      user_role:
        description: 0=Member, 10=Admin, 20=Owner
        type: integer
    type: object
  internal_api.ConfigChanges:
    properties:
      captcha.difficulty:
        enum:
        - low
        - medium
        - high
        type: string
      captcha.enabled:
        type: boolean
      rate_limit.auth_rps:
        type: integer
      rate_limit.global_rps:
        type: integer
      registration.mode:
        enum:
        - open
        - invite_only
        - closed
        type: string
      security.token_expire_hours:
        type: integer
      server.dev:
        type: boolean
      server.domain:
        type: string
      server.frontend_origin:
        type: string
      server.http_port:
        type: integer
      server.max_file_size_mb:
        type: integer
      server.max_video_duration_sec:
        type: integer
      server.max_video_size_mb:
        type: integer
      server.trust_proxy_headers:
        type: boolean
      update.github_fallback:
        type: boolean
      update.manifest_url:
        type: string
      update.notify_admins:
        type: boolean
      voice.embedded_turn_enabled:
        type: boolean
      voice.max_participants_per_call:
        type: integer
      voice.mode:
        enum:
        - webrtc
        - raw_udp
        type: string
      voice.public_ip:
        type: string
    type: object
  internal_api.ConfigSettingResponse:
    properties:
      group:
        description: panel grouping
        type: string
      key:
        description: '"section.key", e.g. "registration.mode"'
        type: string
      max:
        type: integer
      min:
        type: integer
      name:
        description: TOML key
        type: string
      options:
        items:
          type: string
        type: array
      owner_only:
        description: |-
          OwnerOnly keys change network exposure or session security, so only the
          owner (with their password) may touch them.
        type: boolean
      restart_required:
        description: |-
          RestartRequired keys are saved to the file but only take effect after a
          restart. The others are applied live.
        type: boolean
      section:
        description: TOML table
        type: string
      type:
        description: '"enum" | "int" | "bool" | "string"'
        type: string
      value: {}
    type: object
  internal_api.CreateChannelRequest:
    properties:
      avatar_id:
        type: string
      description:
        example: A place for design discussions
        type: string
      is_private:
        example: false
        type: boolean
      members:
        example:
        - '["user-id-1"'
        - '"user-id-2"]'
        items:
          type: string
        type: array
      name:
        example: Design Team
        type: string
    type: object
  internal_api.CreateInviteRequest:
    properties:
      code:
        example: WELCOME-2026
        type: string
      expires_at:
        example: "2026-12-31T23:59:59Z"
        type: string
      max_uses:
        description: 0 = unlimited
        example: 10
        type: integer
      note:
        example: launch party
        type: string
    type: object
  internal_api.DeleteAccountRequest:
    properties:
      password:
        example: s3cur3P@ss!
        type: string
    type: object
  internal_api.DeleteServerRequest:
    properties:
      confirm:
        example: chat.example.com
        type: string
      password:
        type: string
    type: object
  internal_api.ErrorResponse:
    properties:
      code:
        description: Code is a stable machine-readable code from the registry; clients
          branch on it, never on Error.
        example: unauthorized
        type: string
      details:
        additionalProperties:
          type: string
        description: Details carries optional code-specific data, e.g. min_client_version
          for client_outdated.
        type: object
      error:
        description: Error is a human-readable message (or an i18n key the client
          translates).
        example: invalid credentials
        type: string
    type: object
  internal_api.ExploreChannelPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.ExploreChannelResponse'
        type: array
      next_cursor:
        type: string
    type: object
  internal_api.ExploreChannelResponse:
    properties:
      avatar_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      member_count:
        type: integer
      name:
        type: string
    type: object
  internal_api.InviteListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.InviteResponse'
        type: array
      next_cursor:
        type: string
    type: object
  internal_api.InvitePreviewResponse:
    properties:
      already_member:
        type: boolean
      avatar_id:
        type: string
      description:
        type: string
      id:
        type: string
      is_private:
        type: boolean
      member_count:
        type: integer
      name:
        type: string
    type: object
  internal_api.InviteResponse:
    properties:
      code:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      expires_at:
        type: string
      max_uses:
        type: integer
      note:
        type: string
      revoked:
        type: boolean
      source:
        type: string
      status:
        description: Status is "active", "expired", "exhausted" or "revoked".
        type: string
      uses:
        type: integer
    type: object
  internal_api.LoginRequest:
    properties:
      password:
        example: s3cur3P@ss!
        type: string
      username:
        example: alice
        type: string
    type: object
  internal_api.LoginResponse:
    properties:
      allow_channel_adds:
        type: string
      avatar_id:
        type: string
      avatar_ids:
        items:
          type: string
        type: array
      banner_color:
        type: string
      custom_msg:
        type: string
      dm_permission:
        type: string
      domain:
        example: localhost
        type: string
      friend_request_permission:
        type: string
      id:
        example: a3f4...
        type: string
      server_role:
        description: ServerRole is "owner" or "admin" for panel users, empty otherwise.
        type: string
      status:
        example: online
        type: string
      status_preference:
        example: auto
        type: string
      token:
        type: string
      username:
        example: alice
        type: string
    type: object
  internal_api.MessagePageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/cove_backend_internal_models.Message'
        type: array
      next_cursor:
        type: string
    type: object
  internal_api.NoticeRequest:
    properties:
      text:
        example: Scheduled maintenance tonight at 22:00 UTC.
        type: string
    type: object
  internal_api.NoticeResponse:
    properties:
      failed:
        type: integer
      recipients:
        type: integer
    type: object
  internal_api.PasswordRequest:
    properties:
      password:
        type: string
    type: object
  internal_api.PresenceResponse:
    properties:
      current_status:
        enum:
        - online
        - away
        - dnd
        - offline
        example: online
        type: string
      last_seen:
        type: string
    type: object
  internal_api.RegisterRequest:
    properties:
      captcha:
        description: |-
          Captcha is the solved ALTCHA payload (base64 JSON) for a challenge from GET /api/captcha/challenge. It is
          required when /api/server-info reports captcha_required.
        example: eyJhbGdvcml0aG0iOiJTSEEtMjU2IiwuLi59
        type: string
      invite_code:
        description: InviteCode is required when the server runs in invite-only mode.
        example: K7M2-X9QF
        type: string
      password:
        example: s3cur3P@ss!
        type: string
      username:
        example: alice
        type: string
    type: object
  internal_api.RegisterResponse:
    properties:
      id:
        example: a3f4...
        type: string
      username:
        example: alice
        type: string
    type: object
  internal_api.RelationshipActionRequest:
    properties:
      action:
        description: '"request" | "accept" | "decline" | "cancel" | "remove" | "block"
          | "unblock"'
        type: string
    type: object
  internal_api.RelationshipPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.RelationshipResponse'
        type: array
      next_cursor:
        type: string
    type: object
  internal_api.RelationshipResponse:
    properties:
      created_at:
        type: string
      from_user_id:
        type: string
      to_user_id:
        type: string
      type:
        description: '"none" | "requested" | "friend" | "blocked"'
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/internal_api.UserResponse'
    type: object
  internal_api.ResetRequest:
    properties:
      confirm:
        example: RESET
        type: string
      password:
        type: string
    type: object
  internal_api.RestartRequest:
    properties:
      password:
        description: Password is the owner's current password.
        type: string
    type: object
  internal_api.ServerInfoResponse:
    properties:
      captcha_required:
        description: |-
          CaptchaRequired is true when sign-up needs a solved proof-of-work challenge (GET /api/captcha/challenge).
          It is false while the server still has no owner, because that first account is always allowed.
        example: false
        type: boolean
      demo:
        description: Demo is true on a public demo instance; clients show a notice
          that data resets and is not private.
        example: false
        type: boolean
      needs_owner:
        description: 'NeedsOwner is true on a fresh server: the next account created
          becomes the owner.'
        example: false
        type: boolean
      registration_mode:
        description: RegistrationMode is "open", "invite_only" or "closed".
        example: invite_only
        type: string
    type: object
  internal_api.SessionResponse:
    properties:
      app_name:
        example: Cove Desktop 0.9.0
        type: string
      city:
        example: Tehran
        type: string
      country:
        example: Iran
        type: string
      created_at:
        type: string
      current:
        type: boolean
      device_name:
        example: Chrome on Windows
        type: string
      id:
        type: string
      ip:
        example: 203.0.113.7
        type: string
      last_active_at:
        type: string
      platform:
        example: Windows
        type: string
    type: object
  internal_api.SkippedMember:
    properties:
      reason:
        type: string
      user_id:
        type: string
    type: object
  internal_api.StatusResponse:
    properties:
      status:
        example: success
        type: string
    type: object
  internal_api.TransferOwnerRequest:
    properties:
      confirm:
        example: TRANSFER
        type: string
      password:
        type: string
      username:
        example: alice
        type: string
    type: object
  internal_api.UpdateChannelRequest:
    properties:
      avatar_id:
        type: string
      description:
        type: string
      is_private:
        type: boolean
      name:
        type: string
    type: object
  internal_api.UpdateConfigRequest:
    properties:
      changes:
        $ref: '#/definitions/internal_api.ConfigChanges'
      password:
        type: string
    type: object
  internal_api.UpdateConfigResponse:
    properties:
      applied:
        items:
          type: string
        type: array
      restart_required:
        items:
          type: string
        type: array
    type: object
  internal_api.UpdateInfoResponse:
    properties:
      can_restart:
        description: CanRestart is true when POST /api/admin/restart can restart this
          install (binary mode with a restart hook).
        example: true
        type: boolean
      can_update:
        description: 'CanUpdate is true only when the button may be used right now:
          binary mode, a newer release and no job running.'
        example: true
        type: boolean
      check_error:
        description: CheckError is an i18n key set when GitHub could not be reached;
          everything else is still filled in.
        example: admin.errors.update_check_failed
        type: string
      checked_at:
        description: RFC3339; when the release list was last fetched
        type: string
      current_version:
        example: 0.9.9
        type: string
      error:
        description: Error is an i18n key describing why the last update attempt failed.
        example: admin.errors.update_checksum_failed
        type: string
      instructions:
        description: Instructions is the manual command, set in docker mode.
        example: docker compose pull && docker compose up -d
        type: string
      latest_version:
        description: empty when no release could be determined
        example: 0.10.0
        type: string
      mode:
        description: Mode is "binary" (plain executable), "docker" (container, never
          self-replaced) or "unknown".
        enum:
        - binary
        - docker
        - unknown
        example: binary
        type: string
      prerelease:
        type: boolean
      progress_percent:
        example: 42
        type: integer
      published_at:
        description: RFC3339
        type: string
      reason:
        description: 'Reason explains a false CanUpdate with an i18n key suffix: docker,
          unsupported, up_to_date, busy.'
        example: docker
        type: string
      release_notes:
        description: GitHub release body (Markdown), truncated to 16 KiB
        type: string
      release_url:
        type: string
      source:
        description: |-
          State is the progress of an update started with POST: idle, downloading, installing, restarting or failed.
          Source is where the release list came from: "manifest" (covechat.dev or a configured mirror) or "github".
        example: manifest
        type: string
      state:
        enum:
        - idle
        - downloading
        - installing
        - restarting
        - failed
        example: idle
        type: string
      update_available:
        example: true
        type: boolean
      uploaded:
        allOf:
        - $ref: '#/definitions/internal_api.UpdateUploadInfo'
        description: Uploaded describes a manually uploaded release waiting to be
          applied (air-gapped installs).
    type: object
  internal_api.UpdateMemberRequest:
    properties:
      role:
        description: Role is 0 (member) or 10 (admin). Ownership cannot be granted
          through this endpoint.
        enum:
        - 0
        - 10
        example: 10
        type: integer
    type: object
  internal_api.UpdateStartRequest:
    properties:
      password:
        description: Password is the owner's current password (step-up for replacing
          the server binary).
        type: string
      source:
        description: 'Source is "release" (default: download the latest) or "upload"
          (install the staged manual upload).'
        enum:
        - release
        - upload
        example: upload
        type: string
    type: object
  internal_api.UpdateStartResponse:
    properties:
      state:
        example: downloading
        type: string
      status:
        example: success
        type: string
      version:
        description: the release being installed
        example: 0.10.0
        type: string
    type: object
  internal_api.UpdateUploadInfo:
    properties:
      kind:
        enum:
        - zip
        - binary
        example: zip
        type: string
      sha256:
        example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        type: string
      size_bytes:
        example: 31457280
        type: integer
      verified:
        description: Verified is true when a checksum was supplied and matched; false
          means the owner chose to trust the file.
        type: boolean
      version:
        example: 0.10.0
        type: string
    type: object
  internal_api.UpdateUploadResponse:
    properties:
      status:
        example: success
        type: string
      upload:
        $ref: '#/definitions/internal_api.UpdateUploadInfo'
    type: object
  internal_api.UpdateUserRequest:
    properties:
      allow_channel_adds:
        type: string
      avatar_id:
        type: string
      avatar_ids:
        items:
          type: string
        type: array
      banner_color:
        type: string
      custom_msg:
        type: string
      dm_permission:
        type: string
      friend_request_permission:
        type: string
      old_password:
        type: string
      password:
        type: string
      status_preference:
        type: string
      username:
        type: string
    type: object
  internal_api.UploadFileResponse:
    properties:
      channel_id:
        type: string
      duration_sec:
        type: number
      id:
        type: string
      mime:
        example: application/octet-stream
        type: string
      owner_id:
        type: string
      processing_status:
        enum:
        - ready
        - processing
        - failed
        type: string
      size:
        type: integer
      thumb_ciphertext:
        items:
          type: integer
        type: array
      thumb_nonce:
        items:
          type: integer
        type: array
      uploaded_at:
        type: string
    type: object
  internal_api.UserPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.UserResponse'
        type: array
      next_cursor:
        type: string
    type: object
  internal_api.UserResponse:
    properties:
      allow_channel_adds:
        type: string
      avatar_id:
        type: string
      avatar_ids:
        items:
          type: string
        type: array
      banner_color:
        type: string
      custom_msg:
        type: string
      dm_permission:
        type: string
      domain:
        example: localhost
        type: string
      friend_request_permission:
        type: string
      id:
        example: user-1
        type: string
      server_role:
        description: ServerRole is only filled in for the caller's own account (/api/me),
          never for other users.
        type: string
      status:
        example: online
        type: string
      status_preference:
        example: auto
        type: string
      username:
        example: alice
        type: string
    type: object
  internal_api.VersionResponse:
    properties:
      api_version:
        description: APIVersion is the integer client/server contract version, bumped
          only on breaking changes.
        example: 2
        type: integer
      capabilities:
        description: Capabilities names the optional features this server supports;
          clients gate UI on these, not on versions.
        example:
        - invite_messages
        - whisper
        - webrtc_sfu
        items:
          type: string
        type: array
      min_client_version:
        description: MinClientVersion is the oldest client semver the admin supports;
          empty when none is set.
        example: 0.9.0
        type: string
      udp_port:
        example: 9090
        type: integer
      version:
        example: V1.0.0
        type: string
    type: object
host: localhost:4000
info:
  contact:
    name: Cove Support
    url: https://github.com/cove/backend/cove-chat
  description: Self-hosted, end-to-end encrypted communication platform.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://cove-chat.local/terms
  title: Cove API
  version: 0.1.0
paths:
  /api/admin/admins:
    get:
      description: '**Access:** Server Admin.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.AdminListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List admins
      tags:
      - admin
  /api/admin/admins/{username}:
    delete:
      consumes:
      - application/json
      description: '**Access:** Server Owner, with their password.'
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      - description: Owner password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.PasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove an account's admin access
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: '**Access:** Server Owner, with their password.'
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      - description: Owner password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.PasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Give an account admin access
      tags:
      - admin
  /api/admin/audit:
    get:
      description: |-
        Paged (`{items, next_cursor}`), newest first. Every entry is reachable by following the cursor.
        **Access:** Server Admin.
      parameters:
      - description: Page size (1-100, default 50)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from the previous page's next_cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.AuditListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Admin audit trail
      tags:
      - admin
  /api/admin/backup:
    post:
      consumes:
      - application/json
      description: |-
        Returns a passphrase-encrypted snapshot of the database (messages stay ciphertext). Restore it with the server CLI.
        **Access:** Server Owner, with their password.
      parameters:
      - description: Password and archive passphrase (min 12 chars)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.BackupRequest'
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download an encrypted backup
      tags:
      - admin
  /api/admin/config:
    get:
      description: |-
        Lists the settings the panel may change with their saved values. Secrets and file paths are never included.
        **Access:** Server Admin.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.AdminConfigResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Editable server settings
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: |-
        Validates every change, writes them into config.toml (comments are kept) and applies live-editable ones immediately. The whole request is rejected if any change is invalid.
        **Access:** Server Admin. Owner-only settings need the owner and their password.
      parameters:
      - description: Settings to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.UpdateConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.UpdateConfigResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change server settings
      tags:
      - admin
  /api/admin/delete:
    post:
      consumes:
      - application/json
      description: |-
        Wipes every account, message and upload, then stops the process. Cannot be undone; take a backup first.
        **Access:** Server Owner, with their password and the server domain typed as confirmation.
      parameters:
      - description: Confirmation
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.DeleteServerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete the server
      tags:
      - admin
  /api/admin/invites:
    get:
      description: |-
        Paged (`{items, next_cursor}`), newest first.
        **Access:** Server Admin.
      parameters:
      - description: Page size (1-100, default 50)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from the previous page's next_cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.InviteListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List invitation codes
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: |-
        Limited-use (max_uses > 0) or unlimited (max_uses = 0), with an optional expiry date. Leave `code` empty for a random one.
        **Access:** Server Admin.
      parameters:
      - description: Invite settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.CreateInviteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_api.InviteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an invitation code
      tags:
      - admin
  /api/admin/invites/{code}:
    delete:
      description: |-
        Codes declared in config.toml cannot be revoked here; remove them from the file.
        **Access:** Server Admin.
      parameters:
      - description: Invite code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.StatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke an invitation code
      tags:
      - admin
  /api/admin/notices:
    post:
      consumes:
      - application/json
      description: |-
        Delivers a message from the server's Cove account to the Cove chat of every user.
        **Access:** Server Owner.
      parameters:
      - description: Notice text (1-2000 characters)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.NoticeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.NoticeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send a server-wide notice
      tags:
      - admin
  /api/admin/overview:
    get:
      description: |-
        Counts, uptime and registration mode for the admin dashboard.
        **Access:** Server Admin.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.AdminOverviewResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Server overview
      tags:
      - admin
  /api/admin/owner/transfer:
    post:
      consumes:
      - application/json
      description: |-
        The previous owner stays on as an admin. Needs the owner's password and the confirmation phrase `TRANSFER`.
        **Access:** Server Owner.
      parameters:
      - description: New owner
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.TransferOwnerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Hand the owner role to another account
      tags:
      - admin
  /api/admin/reset:
    post:
      consumes:
      - application/json
      description: |-
        Deletes all users except the owner, plus channels, messages, files, invites and sessions. Settings in config.toml are kept. Cannot be undone.
        **Access:** Server Owner, with their password and the phrase `RESET`.
      parameters:
      - description: Confirmation
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.ResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reset server data
      tags:
      - admin
  /api/admin/restart:
    post:
      consumes:
      - application/json
      description: |-
        Gracefully shuts the server down and starts it again, for example to apply settings flagged as needing a restart. Answers 202 first, then restarts after a short delay; everyone is disconnected for a few seconds. Refused with 409 in docker mode (restart the container) or when the install cannot restart itself.
        **Access:** Server Owner, with their password.
      parameters:
      - description: Owner password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.RestartRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_api.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Restart the server
      tags:
      - admin
  /api/admin/restore:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Replaces ALL current data with the contents of a backup made by the panel. Everyone is signed out, including the caller. Cannot be undone; take a backup first.
        The form is read as a stream so the password is checked before the (up to 1 GiB) archive is read:
        send `password` and `confirm` BEFORE `file`.
        **Access:** Server Owner, with their password, the archive passphrase and the phrase `RESTORE`.
      parameters:
      - description: Owner password (must precede file)
        in: formData
        name: password
        required: true
        type: string
      - description: Must be RESTORE (must precede file)
        in: formData
        name: confirm
        required: true
        type: string
      - description: Passphrase chosen when the backup was made
        in: formData
        name: passphrase
        required: true
        type: string
      - description: The .cove-backup file (last)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Restore a backup
      tags:
      - admin
  /api/admin/update:
    get:
      description: |-
        Reports the running version, the newest GitHub release with its notes, how this install was deployed (`binary`, `docker` or `unknown`) and whether it can update itself. In docker mode the manual command is returned instead. `?refresh=1` bypasses the 10-minute release cache and is audited. Also reports the progress of a running update.
        **Access:** Server Admin.
      parameters:
      - description: Pass 1 to re-check GitHub now
        in: query
        name: refresh
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.UpdateInfoResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Server update status
      tags:
      - admin
    post:
      description: |-
        Downloads the newest release for this platform, verifies it against the release's SHA256SUMS, replaces the server binary (keeping the old one as `.old`) and restarts the process. Returns 202 immediately; poll `GET /api/admin/update` for progress. Refused with 409 in docker mode (use `docker compose pull && docker compose up -d`), when the install cannot be updated, when already up to date, or while another update runs. A failed checksum aborts before anything is replaced.
        **Access:** Server Owner, with their password.
      parameters:
      - description: Owner password, and optionally source=upload to install the release
          uploaded with POST /api/admin/update/upload instead of downloading
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.UpdateStartRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_api.UpdateStartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update the server
      tags:
      - admin
  /api/admin/update/upload:
    post:
      consumes:
      - multipart/form-data
      description: |-
        For non-Docker installs without internet access (air-gapped): upload the `cove-server-<os>-<arch>.zip` from a release, or the plain binary, together with its version and optionally its SHA-256 (or the release's SHA256SUMS). The file is streamed to disk (never held in memory), must contain exactly the binary for this platform, and is checked against the checksum when one is given. Nothing is executed. Apply it afterwards with `POST /api/admin/update` and `{"source":"upload"}`. Docker installs are refused: pull the new image instead.
        **Access:** Server Owner, with their password (sent before the file).
      parameters:
      - description: Owner password (must precede file)
        in: formData
        name: password
        required: true
        type: string
      - description: Version of the uploaded release, e.g. 0.10.0
        in: formData
        name: version
        required: true
        type: string
      - description: Release zip or plain server binary
        in: formData
        name: file
        required: true
        type: file
      - description: Expected SHA-256 of the uploaded file (hex)
        in: formData
        name: sha256
        type: string
      - description: Contents of the release's SHA256SUMS file
        in: formData
        name: sums
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.UpdateUploadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload a server release manually
      tags:
      - admin
  /api/captcha/challenge:
    get:
      description: |-
        Returns an ALTCHA v1 challenge. The client searches for the number n in [0, maxnumber] with
        SHA-256(salt + n) equal to `challenge`, then sends the base64 JSON
        {algorithm, challenge, number, salt, signature} as `captcha` when registering.
        Each solution works once and expires after a few minutes. Returns 404 when the check is off.
        **Access:** Public.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.CaptchaChallengeResponse'
        "404":
          description: the sign-up check is not enabled on this server
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
