      tags:
      - system
securityDefinitions:
  BearerAuth:
    description: 'Format: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
  BotAuth:
    description: 'Bot tier: "Bot <bot_id>.<secret>". Accepted only on /api/bots/me/...
      and the interaction callback.'
    in: header
    name: Authorization
    type: apiKey
