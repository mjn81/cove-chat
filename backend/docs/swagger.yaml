          description: Created
          schema:
            $ref: '#/definitions/internal_api.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: registration closed, invite required, invite not valid or demo
            server full
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: too many requests, or too many sign-ups from this IP (demo
            mode)
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Register a new account
      tags:
      - auth
  /api/relationships:
    get:
      description: |-
        Friends, outgoing friend requests and blocked users. Paged (`{items, next_cursor}`).
        **Access:** Authenticated.
      parameters:
      - description: Page size (1-100, default 50)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from the previous page's next_cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.RelationshipPageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List the caller's relationships
      tags:
      - relationships
  /api/relationships/incoming:
    get:
      description: |-
        Paged (`{items, next_cursor}`); each item embeds the requester's profile.
        **Access:** Authenticated.
      parameters:
      - description: Page size (1-100, default 50)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from the previous page's next_cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.RelationshipPageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List pending incoming friend requests
      tags:
      - relationships
  /api/server-info:
    get:
      description: |-
        Tells clients whether sign-up is open, invite-only or closed, so the register screen can show the right form.
        **Access:** Public.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.ServerInfoResponse'
      summary: Public server information
      tags:
      - system
  /api/sessions:
    get:
      description: |-
        Returns every live session of the caller, most recently active first. The session making the
        request is flagged as current. Bearer tokens are never returned.
        **Access:** Authenticated.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_api.SessionResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List the signed-in devices of the current user
      tags:
      - sessions
  /api/sessions/{id}:
    delete:
      description: |-
        Ends the caller's own session with the given id and closes its live connections. Another user's
        session id behaves exactly like an unknown one (404).
        **Access:** Authenticated (own sessions only).
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.StatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Terminate one signed-in device
      tags:
      - sessions
  /api/sessions/terminate-others:
    post:
      description: |-
        Ends every session of the caller except the one making the request.
        **Access:** Authenticated.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.StatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Terminate all other signed-in devices
      tags:
      - sessions
  /api/users:
    get:
      description: |-
        Case-insensitive substring match, paged (`{items, next_cursor}`). The query must be at least 2
        characters (shorter ones return an empty page). At most 50 users are returned in total across all
        pages, so the endpoint cannot be used to enumerate the user base.
        **Access:** Authenticated.
      parameters:
      - description: Search query to filter by username (min 2 characters)
        in: query
        name: q
        type: string
      - description: Page size (1-100, default 50)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from the previous page's next_cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.UserPageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Search globally for users by username
      tags:
      - users
  /api/users/{id}:
    get:
      description: |-
        Public profile of any user. Privacy settings are only included for the caller's own account.
        **Access:** Authenticated.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a user by ID
      tags:
      - users
  /api/users/{id}/presence:
    get:
      description: '**Access:** Authenticated.'
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.PresenceResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get presence status for a user
      tags:
      - users
  /api/users/{id}/relationship:
    get:
      description: |-
        Returns type `none` when there is no relationship.
        **Access:** Authenticated.
      parameters:
      - description: Target user ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.RelationshipResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the relationship with another user
      tags:
      - relationships
    put:
      consumes:
      - application/json
      description: |-
        `action` is one of request, accept, decline, cancel, remove, block, unblock. Rule violations (already
        friends, blocked, no pending request, ...) answer 400 with a user-facing message; the target must exist.
        **Access:** Authenticated.
      parameters:
      - description: Target user ID
        in: path
        name: id
        required: true
        type: string
      - description: Action
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.RelationshipActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.RelationshipResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change the relationship with another user
      tags:
      - relationships
  /api/users/me:
    delete:
      consumes:
      - application/json
      description: |-
        Deletes the caller's account after a step-up check: the body must carry the caller's current
        password, and repeated wrong passwords lock the check out for a while (429), like the dangerous
        admin actions. The server owner must transfer ownership first.
        **Access:** Authenticated (self only).
      parameters:
      - description: Current password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.DeleteAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete current user account
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: |-
        Partial update: only the fields present are changed. Changing the password needs `old_password` and signs
        out every other device. Enumerated fields reject unknown values with `validation_failed`:
        `status_preference` auto|online|away|dnd|offline, `allow_channel_adds` and `dm_permission`
        everyone|friends|nobody, `friend_request_permission` everyone|nobody.
        **Access:** Authenticated (self only).
      parameters:
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - users
  /api/version:
    get:
      description: |-
        Returns the semantic version of the Cove backend currently running, the API version,
        the minimum supported client version and the capabilities the server advertises.
        In `voice.mode = "raw_udp"` the capabilities include `raw_udp_voice` and `raw_udp_media` (calls over the encrypted
        UDP media protocol, native clients only; see docs/udp-media.md) and omit `webrtc_sfu`.
        **Access:** Public.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.VersionResponse'
      summary: Get the current server build version
      tags:
      - system
securityDefinitions:
  BearerAuth:
    description: 'Format: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
