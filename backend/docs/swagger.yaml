      description: |-
        Multipart form: `file` (PNG, JPEG, GIF or WebP; SVG and everything else is refused by magic bytes, never by
        the claimed content type) and optional `emoji` (the emoji the sticker stands for). At most 4 MB is accepted;
        the stored result is at most 512x512 and 512 KB. With ffmpeg the image is re-encoded to WebP (metadata is
        stripped, animations stay animated, at most 10 s); without it only files that already fit are accepted
        unchanged. Limited by the admin's quotas (stickers per pack, total bytes) and refused while user uploads are off.
        **Access:** Authenticated (pack owner, when user uploads are enabled).
