          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Search public channels
      tags:
      - channels
  /api/emoji/animated:
    get:
      description: |-
        Maps an emoji (code point sequence, lower-case hex joined by `-`, every FE0F removed) to an animated
        WebP. A message that is exactly one emoji with an entry here is shown as a big animation on the client;
        the message stays plain Unicode on the wire. Images are the Cove Moves animations (256 px).
        **Access:** Authenticated.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.AnimatedEmojiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Animated emoji table
      tags:
      - emoji
  /api/emoji/animated/{version}/{file}:
    get:
      description: |-
        `file` is `<id>.webp` from the table. Immutable, versioned URL (see `GET /api/emoji/animated`).
        **Access:** Authenticated.
      parameters:
      - description: Content version
        in: path
        name: version
        required: true
        type: string
      - description: <id>.webp
        in: path
        name: file
        required: true
        type: string
      produces:
      - image/webp
      responses:
        "200":
          description: OK
          schema:
            type: file
        "304":
          description: Not Modified
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download one animated emoji
      tags:
      - emoji
  /api/emoji/custom:
    get:
      description: |-
        The server's custom emoji. They travel as `:name:` inside ordinary text messages (no message type);
        a client resolves the shortcode with this list and shows the text unchanged when it is unknown.
        `version` changes whenever the set changes; the response also carries an ETag.
        **Access:** Authenticated.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.CustomEmojiListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Custom emoji
      tags:
      - emoji
  /api/emoji/styles:
    get:
      description: |-
        Returns the styles the admin enabled, the default one, and for each downloadable style a WebP sprite
        sheet plus a JSON index (code point sequence to cell corner) at immutable, versioned URLs. `native`
        (the device's own emoji font) has no assets. Clients bundle at most the default style and download the
        others on demand. The same choice is visible without signing in at `GET /api/server-info`.
        **Access:** Authenticated.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.EmojiStylesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Emoji styles this server offers
      tags:
      - emoji
  /api/emoji/styles/{style}/{version}/{file}:
    get:
      description: |-
        `file` is `sheet.webp` or `index.json`. The URL contains the content version from `GET /api/emoji/styles`,
        so the response is immutable (`Cache-Control: private, max-age=31536000, immutable`, ETag). A style the
        admin has not enabled, or a stale version, is 404.
        **Access:** Authenticated.
      parameters:
      - description: Style id
        in: path
        name: style
        required: true
        type: string
      - description: Content version
        in: path
        name: version
        required: true
        type: string
      - description: sheet.webp or index.json
        in: path
        name: file
        required: true
        type: string
      produces:
      - image/webp
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: file
        "304":
          description: Not Modified
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download an emoji style's sprite sheet or index
      tags:
      - emoji
  /api/files:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Multipart form: `file` (required), `channel_id` (optional; the caller must be an active member), `is_video`
        (`true` for video messages, which are probed and transcoded in the background), `thumb_ciphertext` and
        `thumb_nonce` (base64, optional). The stored content type is sniffed from the bytes, never taken from
        the client. The response never contains the server-side storage path.
        **Access:** Authenticated (channel uploads: Channel Member).
      parameters:
      - description: The (already encrypted) file
        in: formData
        name: file
        required: true
        type: file
      - description: Channel the file belongs to
        in: formData
        name: channel_id
        type: string
      - description: Treat the upload as a video message
        in: formData
        name: is_video
        type: boolean
      - description: Base64 encrypted thumbnail
        in: formData
        name: thumb_ciphertext
        type: string
      - description: Base64 thumbnail nonce
        in: formData
        name: thumb_nonce
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_api.UploadFileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload an encrypted file or video message
      tags:
      - files
  /api/files/{id}:
    get:
      description: |-
        Returns the raw (still encrypted) bytes with the stored content type, always as an attachment. Files that
        belong to a private channel are only served to its members; files without a channel (avatars) to any
        signed-in user.
        **Access:** Authenticated (files of private channels: Channel Member).
      parameters:
      - description: File ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download a stored file
      tags:
      - files
  /api/interactions/{id}/{token}/callback:
    post:
      consumes:
      - application/json
      description: |-
        Answers a command, button press or keyboard key with `message` (a new message), `update_message` (edit
        the message the button was on) or `ack` (silent acknowledgement; one follow-up `message` may come
        later). The token comes with the interaction event and is valid for 15 minutes and two answers.
        A wrong, expired or used-up token is 404 `interaction_expired`.
        **Access:** Bot (the bot the interaction was addressed to) with the interaction token.
      parameters:
      - description: Interaction ID
        in: path
        name: id
        required: true
        type: string
      - description: Interaction token
        in: path
        name: token
        required: true
        type: string
      - description: Answer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.InteractionCallbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.BotMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BotAuth: []
      summary: Answer an interaction
      tags:
      - bot-api
