          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a channel member's role
      tags:
      - channels
  /api/channels/{id}/messages:
    get:
      description: |-
        Paged (`{items, next_cursor}`), **newest first**: the first page is the latest messages and
        `next_cursor` points at the next older page (it encodes the position of the oldest message returned).
        `next_cursor` is empty when the start of the conversation was reached. A malformed `cursor` or an
        out-of-range `limit` is rejected with 400 `validation_failed`.
        **Access:** Channel Member.
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      - description: Page size (1-100, default 50)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from the previous page's next_cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.MessagePageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List messages of a channel
      tags:
      - messages
  /api/channels/explore:
    get:
      description: |-
        Lists public (non-private) group channels whose name contains `q`, paged (`{items, next_cursor}`),
        ordered by name. The result carries no invite link: a public channel is joined with
        `POST /api/join/{link}` using its **id**.
        **Access:** Authenticated.
      parameters:
      - description: Search query
        in: query
        name: q
        type: string
      - description: Page size (1-100, default 50)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from the previous page's next_cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.ExploreChannelPageResponse'
        "400":
